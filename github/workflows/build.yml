name: build-exe

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install requests pyinstaller

      - name: Build
        run: pyinstaller --onefile --name bomber bomber.py

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: bomber-windows
          path: dist/bomber.exe
